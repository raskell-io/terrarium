<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrarium</title>
  <meta name="description" content="Terrarium's terminal viewer in the browser: a world simulation where people forage, share, quarrel, build and raise families.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1e1e1e;
      color: #e6e6e6;
    }
    body {
      overflow: hidden;
    }
    canvas:focus { outline: none; }
    .loading {
      font: 16px "JetBrains Mono", Menlo, Consolas, monospace;
      color: #9a9a9a;
    }
  </style>
</head>
<body>
  <noscript>Terrarium runs in your browser and needs JavaScript and WebAssembly.</noscript>
  <script type="module">
    import init from "./pkg/terrarium_web.js";
    // The terminal is drawn in JetBrains Mono, so have the font ready before it starts
    document.fonts.load('16px "JetBrains Mono"')
      .catch(() => {})
      .then(() => init())
      .then(() => {
        // Ratzilla listens for keys on its canvas, so keep it focused: now, and after any click
        const grid = document.querySelector("canvas");
        const focus = () => grid && grid.focus({ preventScroll: true });
        focus();
        document.addEventListener("click", focus);
        window.addEventListener("focus", focus);
      })
      .catch((e) => {
        document.body.textContent = "Terrarium could not start: " + e;
        document.body.className = "loading";
      });
  </script>
</body>
</html>
