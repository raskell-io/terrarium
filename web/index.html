<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrarium</title>
  <meta name="description" content="Terrarium's terminal viewer in the browser: a world simulation where people forage, share, quarrel, build and raise families.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1e1e1e;
      color: #e6e6e6;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Ratzilla renders the terminal as a grid of preformatted rows */
    pre {
      margin: 0;
      font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      font-size: 16px;
      line-height: 1.15;
    }
    .loading {
      font: 16px "JetBrains Mono", Menlo, Consolas, monospace;
      color: #9a9a9a;
    }
  </style>
</head>
<body>
  <noscript>Terrarium runs in your browser and needs JavaScript and WebAssembly.</noscript>
  <script type="module">
    import init from "./pkg/terrarium_web.js";
    init().catch((e) => {
      document.body.textContent = "Terrarium could not start: " + e;
      document.body.className = "loading";
    });
  </script>
</body>
</html>
