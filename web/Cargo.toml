[package]
name = "terrarium-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terrarium's terminal viewer in the browser: the engine and TUI compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
terrarium = { path = "..", default-features = false, features = ["tui"] }
ratzilla = "0.3.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location"] }
toml = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand and uuid draw randomness through getrandom; in the browser it comes from crypto
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
