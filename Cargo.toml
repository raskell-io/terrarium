[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A societal simulation engine where LLM-powered agents form emergent civilizations"
license = "MIT"
repository = "https://github.com/raskell-io/terrarium"

[workspace]
members = [".", "web"]

[lib]
path = "src/lib.rs"

[features]
default = ["native"]
# The TUI's app state, drawing and key handling (no terminal backend); the browser uses this
tui = ["dep:ratatui"]
# The CLI, terminal run loop, file output and Claude API client; off for the browser build
native = ["tui", "ratatui/crossterm", "dep:tokio", "dep:reqwest", "dep:clap", "dep:tracing-subscriber", "dep:crossterm"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for LLM APIs
reqwest = { version = "0.13", features = ["json"], optional = true }

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Random number generation
rand = "0.10"

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
toml = "1"

# TUI
ratatui = { version = "0.30", default-features = false, features = ["std", "all-widgets", "macros", "layout-cache"], optional = true }
crossterm = { version = "0.29", optional = true }

[[bin]]
name = "terrarium"
path = "src/main.rs"
required-features = ["native"]
